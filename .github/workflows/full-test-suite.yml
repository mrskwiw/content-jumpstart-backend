name: Full Test Suite (nightly)

# The full ~6.3k-test suite is too slow (~17 min) for every push, so it runs
# nightly and on manual dispatch. Per-push CI runs a fast subset (quality-gates.yml
# -> python-tests). Report-only for now (the suite has ~150 pre-existing reds,
# BUGS #179); ratchet to blocking once green. See ../TODO.md OPS-02/OPS-04.

on:
  schedule:
    # 07:00 UTC daily (~midnight US Pacific)
    - cron: '0 7 * * *'
  workflow_dispatch:  # allow manual runs

jobs:
  full-suite:
    name: Full Python Test Suite
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "Xq7Kp2Lm9Rt4Vz8Nw1Yb6Hc3Dj0Sg5Ae2Ui9Oo3Pl"  # pragma: allowlist secret
      ANTHROPIC_API_KEY: "sk-ant-api03-ci-test-key-0000000000000000000000000"  # pragma: allowlist secret
      TESTING: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run full suite
        continue-on-error: true  # report-only until reds cleared (BUGS #179)
        run: |
          # Exclude dirs that manipulate/close stdout and crash pytest's capture on
          # this runner (agent/live/manual/debug), and requires_server (need a live
          # HTTP server). Report coverage without enforcing the 90% gate yet.
          pytest tests backend/tests \
            --ignore=tests/agent --ignore=tests/live \
            --ignore=tests/manual --ignore=tests/debug \
            -o addopts="" -p no:cacheprovider \
            -m "not requires_server" \
            --continue-on-collection-errors \
            --timeout=60 --timeout-method=thread \
            --cov=src --cov=backend --cov-report=term --cov-report=xml --cov-fail-under=0 \
            -q

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-full
          path: coverage.xml
