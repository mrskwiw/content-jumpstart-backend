name: Quality Gates

# Python tests run in CI (restructure Phase 5 brought the suite into the repo).
# `python-tests` runs a FAST subset (tests/unit + backend/tests) on every push and
# is BLOCKING (OPS-07, ratcheted 2026-07-06 after BUGS #179 cleared the reds and the
# fast subset went green in CI). Env-dependent tests skip when their resource is
# absent; the full ~6.3k-test suite still runs nightly (report-only) in
# full-test-suite.yml. See ../TODO.md → OPS-02/OPS-07.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pin black/ruff to the pre-commit versions (.pre-commit-config.yaml) so
          # local, pre-commit, and CI all agree — unpinned latest formats differently.
          pip install black==25.12.0 ruff==0.14.10 mypy pre-commit

      # tests/ is intentionally excluded — the suite lives outside the repo (see header note).
      - name: Check code formatting (Black)
        run: |
          black --check --line-length=100 src/ backend/
        continue-on-error: false  # Fail if not formatted

      - name: Lint with Ruff
        run: |
          ruff check src/ backend/
        continue-on-error: false  # Fail on lint errors

      - name: Type check with mypy
        run: |
          mypy src/
        continue-on-error: true  # Warning only for now

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files
        continue-on-error: true  # Warning only

  frontend-quality:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: operator-dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd operator-dashboard
          npm ci

      - name: Lint TypeScript/React (blocking)
        # BLOCKING (OPS-08b, 2026-07-10): the ESLint backlog was cleared to 0 errors
        # (PR #9). `eslint .` passes on the remaining warnings, so this now fails only on
        # a NEW lint error, preventing regressions from merging.
        run: |
          cd operator-dashboard
          npm run lint

      - name: Type check
        # Still report-only: the Build step below runs `tsc -b` (blocking), which already
        # type-checks the app; this `--noEmit` pass is a redundant informational signal.
        run: |
          cd operator-dashboard
          npx tsc --noEmit
        continue-on-error: true  # Warning only

      - name: Jest unit tests (blocking)
        # BLOCKING (OPS-08b, 2026-07-10): the frontend suite is green (84 suites, 766
        # passing) after the OPS-08 stale-test cleanup, so a test failure now blocks the
        # merge. --coverage=false so the gate fails on test pass/fail, NOT the aspirational
        # 90% coverageThreshold (real coverage ~46%; calibrating a real floor is a separate
        # follow-up). --maxWorkers=2 keeps the long WizardFlow flows deterministic in CI.
        run: |
          cd operator-dashboard
          npx jest --ci --coverage=false --maxWorkers=2 --passWithNoTests

      - name: Build frontend
        run: |
          cd operator-dashboard
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: operator-dashboard/dist/

  backend-quality:
    name: Backend API Quality
    runs-on: ubuntu-latest
    # Dummy env so `import backend.main` passes config validation without a real
    # DB/keys (in-memory sqlite is allowed for non-prod; keys are never used here).
    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "Xq7Kp2Lm9Rt4Vz8Nw1Yb6Hc3Dj0Sg5Ae2Ui9Oo3Pl"  # pragma: allowlist secret
      ANTHROPIC_API_KEY: "sk-ant-api03-ci-import-check-key-0000000000000000"  # pragma: allowlist secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # backend/requirements.txt is self-contained: it pulls the canonical root
          # file via `-r ../requirements.txt` and adds the web-server layer. One pin
          # per package now (Phase 2 consolidation), so a single install resolves
          # cleanly — the old sequential-install ResolutionImpossible workaround is gone.
          pip install -r backend/requirements.txt

      - name: Verify backend imports
        run: |
          python -c "
          from backend.main import app
          from backend.database import init_db
          print('✅ Backend imports successful')
          "

      - name: Test backend startup
        run: |
          # Test that backend can start (don't actually run it)
          python -c "
          from backend.main import app
          assert app is not None
          print('✅ Backend app created successfully')
          "

  python-tests:
    name: Python Tests (fast subset)
    runs-on: ubuntu-latest
    # BLOCKING (OPS-07): fast subset = tests/unit + backend/tests. A test failure or
    # collection error fails this job and blocks the merge. Env-dependent tests skip
    # themselves when their resource is absent. The full suite runs nightly
    # (report-only) in full-test-suite.yml.
    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "Xq7Kp2Lm9Rt4Vz8Nw1Yb6Hc3Dj0Sg5Ae2Ui9Oo3Pl"  # pragma: allowlist secret
      ANTHROPIC_API_KEY: "sk-ant-api03-ci-test-key-0000000000000000000000000"  # pragma: allowlist secret
      TESTING: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # backend/requirements.txt is self-contained (pulls root via -r).
          pip install -r backend/requirements.txt

      - name: Run fast test subset (unit + backend)
        run: |
          # BLOCKING (OPS-07). Coverage gate calibrated to the fast subset's real
          # coverage (~76.5% local; a few pts lower in CI where env-dependent tests
          # skip) with margin, so it catches a coverage crater without false-failing.
          # Skip requires_server (need a live HTTP server). --continue-on-collection-errors
          # so the junit captures ALL failures for the summary; we then exit with
          # pytest's real code so any failure/collection error/coverage-miss fails the job.
          set +e
          pytest tests/unit backend/tests \
            -o addopts="" -p no:cacheprovider \
            -m "not requires_server" \
            --continue-on-collection-errors \
            --junitxml=fast-subset.xml \
            --cov=src --cov=backend --cov-report=term --cov-fail-under=70 \
            -q
          rc=$?
          echo "PYTEST_RC=$rc" >> "$GITHUB_ENV"
          exit $rc

      # Publish the pass/fail counts to the PR summary. The job already blocks on any
      # failure (step above); this adds a readable summary and a belt-and-suspenders
      # ::warning:: if the junit shows any failure/error.
      - name: Test summary
        if: always()
        run: |
          BASELINE_MAX_FAILURES=0
          # Extract counts from junit attributes without an XML parser (avoids XXE
          # surface + a defusedxml dependency; the file is our own pytest output).
          attr() { grep -o "$1=\"[0-9]*\"" fast-subset.xml | head -1 | grep -o '[0-9]*'; }
          F=$(attr failures); E=$(attr errors); T=$(attr tests)
          F=${F:-0}; E=${E:-0}; T=${T:-0}
          BAD=$(( F + E ))
          {
            echo "## Python fast subset (blocking — OPS-07)"
            echo ""
            echo "| tests | failures | errors | failures+errors | allowed |"
            echo "|------:|---------:|-------:|----------------:|--------:|"
            echo "| $T | $F | $E | $BAD | $BASELINE_MAX_FAILURES |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BAD" -gt "$BASELINE_MAX_FAILURES" ]; then
            echo "::warning title=Test regression::fast subset has $BAD failures+errors — this job is blocking, so the run is red. Fix the failing tests or, if a test needs a resource absent in CI, guard it with skipif."
          fi

  integration-check:
    name: Integration Check
    runs-on: ubuntu-latest
    needs: [code-quality, frontend-quality, backend-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate quality report
        run: |
          echo "# Quality Gates Report" > quality-report.md
          echo "" >> quality-report.md
          echo "## Check Results" >> quality-report.md
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> quality-report.md
          echo "- Frontend Quality: ${{ needs.frontend-quality.result }}" >> quality-report.md
          echo "- Backend Quality: ${{ needs.backend-quality.result }}" >> quality-report.md
          echo "" >> quality-report.md
          echo "> Python tests run locally, not in CI (see workflow header / TODO OPS-02)." >> quality-report.md
          echo "" >> quality-report.md
          echo "## Status" >> quality-report.md
          if [[ "${{ needs.code-quality.result }}" == "success" ]] && \
             [[ "${{ needs.frontend-quality.result }}" == "success" ]] && \
             [[ "${{ needs.backend-quality.result }}" == "success" ]]; then
            echo "✅ All quality gates passed" >> quality-report.md
          else
            echo "❌ Some quality gates failed" >> quality-report.md
          fi

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: quality-report.md

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [code-quality, frontend-quality, backend-quality]
    if: always()

    steps:
      - name: Check all gates
        run: |
          echo "# Quality Gates Summary"
          echo ""
          echo "## Results:"
          echo "- Code Quality: ${{ needs.code-quality.result }}"
          echo "- Frontend Quality: ${{ needs.frontend-quality.result }}"
          echo "- Backend Quality: ${{ needs.backend-quality.result }}"
          echo ""
          echo "Note: Python tests are enforced locally, not in CI (see TODO OPS-02)."
          echo ""

          # Fail if critical checks failed
          if [[ "${{ needs.code-quality.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-quality.result }}" != "success" ]] || \
             [[ "${{ needs.backend-quality.result }}" != "success" ]]; then
            echo "❌ Critical quality gates failed"
            exit 1
          else
            echo "✅ All critical quality gates passed"
          fi
