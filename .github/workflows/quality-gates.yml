name: Quality Gates

# NOTE: Python unit/integration/security tests are intentionally NOT run in CI.
# The test suite lives at root-level /tests/, which by project convention is never
# pushed (the git repo root is project/). Python tests are enforced LOCALLY via
# pre-commit, Codex adversarial review, and stop hooks. If/when the suite is moved
# into the repo, re-add python-tests + coverage jobs and make them blocking.
# See ../TODO.md → OPS-02 for the decision record and re-enablement steps.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff mypy pre-commit

      # tests/ is intentionally excluded — the suite lives outside the repo (see header note).
      - name: Check code formatting (Black)
        run: |
          black --check --line-length=100 src/ backend/
        continue-on-error: false  # Fail if not formatted

      - name: Lint with Ruff
        run: |
          ruff check src/ backend/
        continue-on-error: false  # Fail on lint errors

      - name: Type check with mypy
        run: |
          mypy src/
        continue-on-error: true  # Warning only for now

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files
        continue-on-error: true  # Warning only

  frontend-quality:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: operator-dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd operator-dashboard
          npm ci

      - name: Lint TypeScript/React
        run: |
          cd operator-dashboard
          npm run lint
        continue-on-error: true  # Warning only

      - name: Type check
        run: |
          cd operator-dashboard
          npx tsc --noEmit
        continue-on-error: true  # Warning only

      - name: Build frontend
        run: |
          cd operator-dashboard
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: operator-dashboard/dist/

  backend-quality:
    name: Backend API Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Verify backend imports
        run: |
          python -c "
          from backend.main import app
          from backend.database import init_db
          print('✅ Backend imports successful')
          "

      - name: Test backend startup
        run: |
          # Test that backend can start (don't actually run it)
          python -c "
          from backend.main import app
          assert app is not None
          print('✅ Backend app created successfully')
          "

  integration-check:
    name: Integration Check
    runs-on: ubuntu-latest
    needs: [code-quality, frontend-quality, backend-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate quality report
        run: |
          echo "# Quality Gates Report" > quality-report.md
          echo "" >> quality-report.md
          echo "## Check Results" >> quality-report.md
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> quality-report.md
          echo "- Frontend Quality: ${{ needs.frontend-quality.result }}" >> quality-report.md
          echo "- Backend Quality: ${{ needs.backend-quality.result }}" >> quality-report.md
          echo "" >> quality-report.md
          echo "> Python tests run locally, not in CI (see workflow header / TODO OPS-02)." >> quality-report.md
          echo "" >> quality-report.md
          echo "## Status" >> quality-report.md
          if [[ "${{ needs.code-quality.result }}" == "success" ]] && \
             [[ "${{ needs.frontend-quality.result }}" == "success" ]] && \
             [[ "${{ needs.backend-quality.result }}" == "success" ]]; then
            echo "✅ All quality gates passed" >> quality-report.md
          else
            echo "❌ Some quality gates failed" >> quality-report.md
          fi

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: quality-report.md

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [code-quality, frontend-quality, backend-quality]
    if: always()

    steps:
      - name: Check all gates
        run: |
          echo "# Quality Gates Summary"
          echo ""
          echo "## Results:"
          echo "- Code Quality: ${{ needs.code-quality.result }}"
          echo "- Frontend Quality: ${{ needs.frontend-quality.result }}"
          echo "- Backend Quality: ${{ needs.backend-quality.result }}"
          echo ""
          echo "Note: Python tests are enforced locally, not in CI (see TODO OPS-02)."
          echo ""

          # Fail if critical checks failed
          if [[ "${{ needs.code-quality.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-quality.result }}" != "success" ]] || \
             [[ "${{ needs.backend-quality.result }}" != "success" ]]; then
            echo "❌ Critical quality gates failed"
            exit 1
          else
            echo "✅ All critical quality gates passed"
          fi
